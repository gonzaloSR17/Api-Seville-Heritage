<form id="filters-form" class="flex items-center gap-3 p-4 overflow-x-auto whitespace-nowrap border-b border-slate-100 bg-white">

  <button
    (click)="this.lanzarFiltro()" class="bg-orange-500 text-white px-5 py-2 rounded-full flex items-center gap-2 hover:bg-orange-600 transition-all shadow-sm">
    Buscar:
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>

  <div class="h-6 w-[1px] bg-slate-200 mx-1 shrink-0"></div>

  <!-- Categoria del edificio -->
<input 
    [(ngModel)]="edificioFiltrado.q" 
    name="q" 
    type="text" 
    placeholder="Ej: Catedral de Sevilla" 
    class="border border-slate-300 text-slate-600 px-4 py-2 rounded-full hover:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-colors w-64"
  >
  <label for="category" class="sr-only">Categoria</label>
  <select [(ngModel)]="edificioFiltrado.category" name="category" id="category-input"
    class="appearance-none border border-slate-300 text-slate-600 px-4 py-2 rounded-full flex items-center gap-2 hover:border-orange-400 hover:text-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-colors bg-white cursor-pointer">
    <option value="" disabled selected>Categoria</option>
    <option value="Todos">Todos</option>
    <option value="Expo 29">Expo 29</option>
    <option value="Expo 92">Expo 92</option>
    <option value="Church">Church</option>
    <option value="House">House</option>
    <option value="Palace">Palace</option>
    <option value="Military">Military</option>
    <option value="Public Services & Facilities">Public Services & Facilities</option>
  </select>
  <!-- Arquitectos del edificio -->
  <label for="architect" class="sr-only">Arquitectos</label>
  <select [(ngModel)]="edificioFiltrado.architect" name="architect" id="architect-input"
    class="appearance-none border border-slate-300 text-slate-600 px-4 py-2 rounded-full flex items-center gap-2 hover:border-orange-400 hover:text-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-colors bg-white cursor-pointer">
    <option value="" disabled selected>Arquitecto</option>
    <option value="Todos">Todos</option>
    <option value="Aníbal González Álvarez-Ossorio">Aníbal González Álvarez-Ossorio</option>
    <option value="José Espiau y Muñoz">José Espiau y Muñoz</option>
    <option value="Juan Talavera y Heredia">Juan Talavera y Heredia</option>
    <option value="José Pérez Reina">José Pérez Reina</option>
  </select>
  
<label for="district" class="sr-only">Distrito</label>
<select 
  [(ngModel)]="edificioFiltrado.district"
  name="district" 
  id="district-input" 
  class="appearance-none border border-slate-300 text-slate-600 px-4 py-2 rounded-full flex items-center gap-2 hover:border-orange-400 hover:text-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-200 transition-colors bg-white cursor-pointer"
>
  <option value="" disabled selected>Distrito</option>
  <option value="Todos">Todos</option>
  <option value="Bellavista">Bellavista</option>
  <option value="CascoAntiguo">Casco Antiguo</option>
  <option value="DistritoMacarena">Distrito Macarena</option>
  <option value="DistritoSurLaPalmera">Distrito Sur La Palmera</option>
  <option value="Nervion">Nervión</option>
  <option value="ParqueDeMariaLuisa">Parque de María Luisa</option>
  <option value="SanPabloSantaJusta">San Pablo-Santa Justa (Los Arcos)</option>
  <option value="Triana">Triana</option>
</select>

  <div class="h-6 w-[1px] bg-slate-200 mx-1 shrink-0"></div>

  <button (click)="this.limpiarFiltro()" type="reset" class="text-slate-500 hover:text-orange-600 font-medium px-4 py-2 transition-colors">
    Limpiar todo
  </button>
</form>
