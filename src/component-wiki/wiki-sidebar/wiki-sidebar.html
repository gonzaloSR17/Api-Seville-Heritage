    <form class="max-w-sm mx-auto p-4 fixed" method="get">
        <h1 class="font-bold my-4 text-center text-2xl">Filtros</h1>
        <!-- Busqueda de nombre del edificio -->
        <label for="search-input">Busca por nombre</label> <br>
        <input [(ngModel)]="edificioFiltrado.q" type="text" name="name" id="search-input" placeholder="Ej:Catedral de Sevilla" class="my-4 w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"> <br>

        <!-- Slider del año -->
         <label for="year">Año de construcción</label>
         <input type="range" name="year" id="year-input" min="913" max="1992" value="1992" class="w-full h-2 bg-orange-100 rounded-lg appearance-none cursor-pointer accent-orange-600 focus:outline-none">
         <div class = "flex justify-between mt-1 px-0.5 mb-4">
            <span class="text-xs font-semibold text-slate-500">913</span>
            <span class="text-xs font-semibold text-slate-500">1992</span>
         </div>
        
        <!-- Lista de Arquitectos -->
         <label for="architect">Arquitectos</label>
            <select [(ngModel)]="edificioFiltrado.architect" name="architect" id="architect-input" class="my-4 w-full bg-transparent text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow">
                <option value="Todos">Todos</option>
                <option value="Aníbal González Álvarez-Ossorio">Aníbal González Álvarez-Ossorio</option>
                <option value="José Espiau y Muñoz">José Espiau y Muñoz</option>
                <option value="Juan Talavera y Heredia">Juan Talavera y Heredia</option>
                <option value="José Pérez Reina">José Pérez Reina</option>
            </select>

            <!-- Categoria del edificio -->
         <label for="category">Categoria</label>
            <select [(ngModel)]="edificioFiltrado.category" name="category" id="category-input" class="my-4 w-full bg-transparent text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow">
                <option value="Todos">Todos</option>
                <option value="Expo 29">Expo 29</option>
                <option value="Expo 92">Expo 92</option>
                <option value="Church">Church</option>
                <option value="House">House</option>
                <option value="Military">Military</option>
                <option value="Public Services & Facilities">Public Services & Facilities</option>
            </select>

            <!-- Distrito -->
         <label for="district">Distrito</label>
<select [(ngModel)]="edificioFiltrado.district" name="district" id="district-input" class="my-4 w-full bg-transparent text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow">
    <option value="Todos">Todos</option>
    <option value="Bellavista">Bellavista</option>
    <option value="CascoAntiguo">Casco Antiguo</option>
    <option value="DistritoMacarena">Distrito Macarena</option>
    <option value="DistritoSurLaPalmera">Distrito Sur La Palmera</option>
    <option value="Nervion">Nervión</option>
    <option value="ParqueDeMariaLuisa">Parque de María Luisa</option>
    <option value="SanPabloSantaJusta">San Pablo-Santa Justa (Los Arcos)</option>
    <option value="Triana">Triana</option>
</select>
<div class="flex">
    <button type="button" (click)="formarFiltro()" id="search-button" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-md transition duration-300 ease focus:outline-none focus:shadow">Buscar</button>
    <button type="button" (click)="limpiarResultados()" id="clear-button" class="bg-gray-200 hover:bg-gray-400 text-gray-700 font-bold py-2 px-4 rounded-md transition duration-300 ease focus:outline-none focus:shadow ml-2">Limpiar</button>
</div>
    </form>
