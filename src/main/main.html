<div class="relative h-screen overflow-hidden">
  <!-- Video de fondo -->
  <video

    autoplay
    muted
    loop
    playsinline
    class="absolute inset-0 w-full h-full object-cover sm-full md-full lg-full"
  >
    <source src="/sevilla1.mp4" type="video/mp4" />
  </video>

  <!-- Overlay oscuro -->
  <div class="absolute inset-0 bg-black/50"></div>

  <!-- Contenido -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full text-center">

      Explora el legado arquitectónico de una ciudad milenaria.
    </p>
    <button routerLink="/wiki" class="bg-gradient-to-r from-orange-400 to-orange-800 hover:from-orange-700 hover:to-orange-900 text-white font-bold p-5 text-4xl rounded ">
